<main class="app">
<header><div><div class="eyebrow">YOUR POCKET COMPANION</div><h1>小麦的口袋 <span style="font-size:19px">🌾</span></h1><p class="subtitle">把今天的一点快乐，装进口袋。</p></div><div class="header-buttons"><button class="icon-btn" id="journalButton" aria-label="打开成长手记">▤</button><button class="icon-btn" id="settingsButton" aria-label="打开设置">⚙</button></div></header>
